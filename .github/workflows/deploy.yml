name: Deploy static content to Pages
on:
  push:
    branches: ['dev']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'  # 指定使用pnpm缓存
          cache-dependency-path: pnpm-lock.yaml  # 指定pnpm锁文件
      - name: Install pnpm
        uses: pnpm/action-setup@v2  # 添加pnpm安装步骤
        with:
          version: latest  # 使用最新版本的pnpm
      - name: Install dependencies
        run: pnpm install  # 使用pnpm安装依赖
      - name: Build
        run: pnpm build  # 使用pnpm执行构建命令
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4